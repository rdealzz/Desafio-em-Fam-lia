name: desafio_em_familia
description: App de gamificação familiar — o Cofre de Pontos da Família.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3

  # Estado
  provider: ^6.1.2

  # Mídia / util
  image_picker: ^1.1.2
  intl: ^0.19.0

  # Contador de passos (HealthKit / Google Fit).
  # Descomente quando for plugar o HealthService real (ver lib/services/health_service.dart).
  # health: ^11.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
