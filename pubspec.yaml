name: desafio_em_familia
description: App de gamificação familiar — o Cofre de Pontos da Família.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3

  # Estado
  provider: ^6.1.2

  # Mídia / util
  image_picker: ^1.1.2
  intl: ^0.19.0

  # Fila offline: registros ficam no disco até haver internet
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Contador de passos (HealthKit / Google Fit).
  # Descomente quando for plugar o HealthService real (ver lib/services/health_service.dart).
  # health: ^11.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Inter empacotada em vez de baixada em tempo de execução: sem requisição
  # extra e sem o piscar de texto sem estilo no primeiro carregamento.
  # Três pesos só — cada arquivo pesa ~400 KB.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

    # Emoji de bicho para os avatares. Recorte da Noto Color Emoji (OFL) com
    # só os 22 desenhos usados: 44 KB em vez dos 10 MB do arquivo completo.
    # Empacotada porque o CanvasKit do Flutter web ignora a fonte de emoji do
    # sistema e desenharia quadradinho no navegador.
    - family: AnimalEmoji
      fonts:
        - asset: assets/fonts/AnimalEmoji.ttf
