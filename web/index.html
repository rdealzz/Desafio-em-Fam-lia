<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Desafio em Família</title>
  <meta name="description" content="Um cofre de pontos, quatro pessoas, um prêmio por semana.">

  <base href="$FLUTTER_BASE_HREF">

  <link rel="manifest" href="manifest.json">
  <!-- Acompanha o tema do aparelho: o app abre no claro, mas quem estiver no
       escuro não leva uma faixa branca no topo. -->
  <meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1015" media="(prefers-color-scheme: dark)">

  <!-- Instalável como app no celular -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Desafio">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    /* As cores saem da mesma paleta do app (lib/core/theme/palette.dart), para
       não haver salto de cor entre esta tela e o primeiro quadro do Flutter. */
    :root { --fundo: #F2F3F7; --tinta: #14161C; --fraca: #61656F; }
    @media (prefers-color-scheme: dark) {
      :root { --fundo: #0E1015; --tinta: #F2F3F7; --fraca: #9AA0AC; }
    }
    body { margin: 0; background: var(--fundo); }
    /* Tela de carregamento enquanto o Flutter inicializa — sem isso o
       primeiro segundo é uma página em branco. */
    #carregando {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--fraca); background: var(--fundo);
    }
    /* Imagem em vez de emoji: navegador sem fonte de emoji desenhava um
       quadradinho bem na primeira tela do app. */
    #carregando img { width: 64px; height: 64px; border-radius: 15px; }
    #carregando .nome { font-size: 17px; font-weight: 700; color: var(--tinta); }
    @keyframes pulsa { 0%, 100% { opacity: 1 } 50% { opacity: .5 } }
    #carregando img { animation: pulsa 1.5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      #carregando img { animation: none; }
    }
  </style>
</head>
<body>
  <div id="carregando">
    <img src="icons/Icon-192.png" alt="">
    <div class="nome">Desafio em Família</div>
    <div>carregando…</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('carregando');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
