name: Publicar no GitHub Pages

# Caminho alternativo à Vercel: publica direto do GitHub, sem conta em outro
# serviço e sem passo manual — o `enablement: true` mais abaixo liga o Pages
# pela API na primeira execução.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # O Pages serve o projeto em /<nome-do-repo>/, não na raiz do domínio.
      # Sem o base-href certo, o app carrega e depois quebra ao buscar os
      # próprios arquivos.
      - name: Build web
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/"

      # enablement: true liga o Pages sozinho em vez de exigir a visita a
      # Settings → Pages. Sem isto, a ação só consulta, e num repositório com
      # Pages desligado ela falha com "Get Pages site failed ... Not Found" —
      # o app compila e não tem para onde ir. Funciona porque o bloco
      # `permissions` acima já concede `pages: write`.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
